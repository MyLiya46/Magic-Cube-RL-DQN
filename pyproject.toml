[project]
name = "magic-cube-ai"
version = "0.1.0"
description = "A 3D Rubik's Cube demonstration driven by a 12-action reinforcement-learning policy."
readme = "readme.md"
requires-python = ">=3.11"
dependencies = [
    "gymnasium>=1.0,<2.0",
    "numpy>=2.0,<3.0",
    "PyOpenGL>=3.1.7,<4.0",
    "PySide6>=6.7,<7.0",
    "stable-baselines3>=2.4,<3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
]

[project.scripts]
magic-cube = "magic_cube.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["magic_cube"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
